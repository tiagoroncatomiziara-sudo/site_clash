<!DOCTYPE html>
<html>
<head>
    <title>Gerador de Deck</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>⚔️ Gerador de Deck</h1>

    <!-- GERAR DECK -->
    <form method="POST">
        <label>Elixir médio desejado:</label>
        <input type="number" step="0.1" name="elixir" required>

        <button type="submit" name="acao" value="gerar">Gerar Deck</button>
    </form>

    <!-- FILTRAR POR ARENA -->
    <form method="POST">
        <button type="submit" name="acao" value="arena">Filtrar por Arena</button>
    </form>

</div>

<footer>Site criado por Tiago Roncato</footer>

</body>
</html>
